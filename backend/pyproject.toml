[project]
name = "agent-workbench-backend"
version = "0.1.0"
description = "Local Agent Workbench API for persistent Codex chats and reproducible coding evaluations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Code-style target keeps parenthesized multi-exception handlers readable.
# Runtime still requires Python 3.14 (see requires-python above).
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "UP", "SIM", "S", "BLE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Disposable fixtures intentionally use assertions, fake secrets and Git/process tools.
# S108: illustrative paths; ASYNC110: bounded polling of external child/file state.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "ASYNC110", "ASYNC240"]
# Operator-run verification scripts assert evidence and invoke selected local tools.
"tools/**" = ["S101", "S603", "S607"]
